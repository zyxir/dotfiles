# 此文件配置了整個輸入法的行爲。

patch:
  # 每页显示 9 個候選
  "menu/page_size": 9
  # 只使用倉頡和速成，雙拼作爲後備
  schema_list:
    - schema: cangjie5
    - schema: quick5
    - schema: double_pinyin
    - schema: rime_ice
  # 這些鍵位很少衝突，兼顧 Windows 和 macOS
  "switcher/hotkeys":
    - Control+Shift+1
    - Control+Shift+2
    - Control+Shift+3
    - Control+Shift+4
    - Control+Shift+5
    - Control+Shift+6
    - Control+Shift+7
    - Control+Shift+8
    - Control+Shift+9
