services:
  # PostgreSQL 數據庫
  postgres:
    image: postgres:18-bookworm
    container_name: postgres
    restart: unless-stopped
    environment:
      - POSTGRES_USER=${DB_USER}
      - POSTGRES_PASSWORD=${DB_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql
    networks:
      - internal_network

  # Caddy 反向代理
  caddy:
    image: caddy:2-alpine
    container_name: caddy
    restart: unless-stopped
    environment:
      - DOMAIN=${DOMAIN}
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile
      - ./subconv/secret:/srv/subconv/secret
      - caddy_data:/data
      - caddy_config:/config
    networks:
      - internal_network
    extra_hosts:
      - "host.docker.internal:host-gateway"

networks:
  internal_network:
    driver: bridge

volumes:
  postgres_data:
  caddy_data:
  caddy_config: