services:
  # Caddy reverse proxy
  caddy:
    image: caddy:2-alpine
    container_name: caddy
    restart: unless-stopped
    environment:
      - DOMAIN=${DOMAIN}
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile
      - caddy_data:/data
      - caddy_config:/config
    networks:
      - internal_network

  # Tailscale DERP relay server
  # IP-only DERP — no domain, no Cloudflare, no Let's Encrypt.
  # Requires a self-signed cert (generated once on the host):
  #   mkdir -p ./derper-certs
  #   openssl req -x509 -newkey rsa:2048 \
  #     -keyout ./derper-certs/derper.local.key \
  #     -out   ./derper-certs/derper.local.crt \
  #     -days 3650 -nodes \
  #     -subj "/CN=derper.local" \
  #     -addext "subjectAltName=DNS:derper.local"
  derper:
    image: fredliang/derper
    container_name: derper
    restart: unless-stopped
    environment:
      - DERP_DOMAIN=derper.local
      - DERP_ADDR=:8080
      - DERP_CERT_MODE=manual
      - DERP_CERT_DIR=/certs
      - DERP_VERIFY_CLIENTS=true
      - DERP_STUN=true
      - DERP_STUN_PORT=33478
      - DERP_HTTP_PORT=-1
    ports:
      - "8443:8080"             # DERP relay (self-signed TLS, bypasses Caddy)
      - "33478:33478/udp"       # STUN
    volumes:
      - ./derper-certs:/certs
      - /var/run/tailscale/tailscaled.sock:/var/run/tailscale/tailscaled.sock
    networks:
      - internal_network

networks:
  internal_network:
    driver: bridge

volumes:
  caddy_data:
  caddy_config:
