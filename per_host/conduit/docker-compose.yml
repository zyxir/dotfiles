services:
  # Caddy reverse proxy
  caddy:
    image: caddy:2-alpine
    container_name: caddy
    restart: unless-stopped
    environment:
      - DOMAIN=${DOMAIN}
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
      - "8443:443"   # Tailscale DERP (non-standard, avoids ICP port-blocking)
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile
      - caddy_data:/data
      - caddy_config:/config
    networks:
      - internal_network

  # Tailscale DERP relay server
  derper:
    build: ./derper
    container_name: derper
    restart: unless-stopped
    environment:
      - DERP_DOMAIN=derp.${DOMAIN}
      - DERP_STUN_PORT=33478
      - DERP_VERIFY_CLIENTS=true
    ports:
      - "33478:33478/udp"   # STUN (direct host exposure, can't go through Caddy)
    volumes:
      - derper_certs:/certs
      - /var/run/tailscale/tailscaled.sock:/var/run/tailscale/tailscaled.sock
    networks:
      - internal_network

networks:
  internal_network:
    driver: bridge

volumes:
  caddy_data:
  caddy_config:
  derper_certs:
