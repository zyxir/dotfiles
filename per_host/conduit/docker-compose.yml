services:
  # Caddy reverse proxy
  caddy:
    image: caddy:2-alpine
    container_name: caddy
    restart: unless-stopped
    environment:
      - DOMAIN=${DOMAIN}
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
      - "8443:443"   # Tailscale DERP (non-standard, avoids ICP port-blocking)
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile
      - caddy_data:/data
      - caddy_config:/config
    networks:
      - internal_network

  # Tailscale DERP relay server
  # Requires a self-signed cert for the DERP hostname:
  #   mkdir -p ./derper-certs
  #   openssl req -x509 -newkey rsa:2048 \
  #     -keyout ./derper-certs/derp.YOUR.DOMAIN.key \
  #     -out   ./derper-certs/derp.YOUR.DOMAIN.crt \
  #     -days 3650 -nodes \
  #     -subj "/CN=derp.YOUR.DOMAIN" \
  #     -addext "subjectAltName=DNS:derp.YOUR.DOMAIN"
  derper:
    image: fredliang/derper
    container_name: derper
    restart: unless-stopped
    environment:
      - DERP_DOMAIN=derp.${DOMAIN}
      - DERP_ADDR=:8080
      - DERP_CERT_MODE=manual
      - DERP_CERT_DIR=/certs
      - DERP_VERIFY_CLIENTS=true
      - DERP_STUN=true
      - DERP_STUN_PORT=33478
      - DERP_HTTP_PORT=-1
    ports:
      - "33478:33478/udp"   # STUN (direct host exposure, can't go through Caddy)
    volumes:
      - ./derper-certs:/certs
      - /var/run/tailscale/tailscaled.sock:/var/run/tailscale/tailscaled.sock
    networks:
      - internal_network

networks:
  internal_network:
    driver: bridge

volumes:
  caddy_data:
  caddy_config:
